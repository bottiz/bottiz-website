<div class="industry-grid">
{{#each industries}}<div class="industry-card">
<div class="industry-icon"><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" viewBox="0 0 24 24">{{icon}}</svg></div>
<span class="industry-en">{{en}}</span>
<h3>{{name}}</h3>
<p>{{pain}}</p>
<p class="industry-scenes">{{scenes}}</p>
<a class="industry-link" href="{{href}}">了解方案 <b>→</b></a>
</div>
{{/each}}</div>
