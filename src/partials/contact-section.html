<section class="contact-section" id="contact">
<div class="contact-panel">
<div class="contact-brand">
<img alt="{{site.name}}" class="brand-icon contact-brand-icon" src="{{site.logo.full}}" width="{{site.logo.width}}" height="{{site.logo.height}}" loading="eager" fetchpriority="high" decoding="async"/>
</div>
<p class="contact-description">{{site.contactDescription}}</p>
</div>
<div class="contact-panel">
<h2 class="contact-title">聯絡我們</h2>
<div class="contact-list">
<div class="contact-item">
<strong>電話</strong>
<a href="tel:{{site.contact.phoneHref}}">{{site.contact.phoneDisplay}}</a>
</div>
<div class="contact-item">
<strong>Email</strong>
<a href="mailto:{{site.contact.email}}">{{site.contact.email}}</a>
</div>
<div class="contact-item">
<strong>地址</strong>
<address class="contact-address">
<a href="{{site.contact.mapUrl|e}}" rel="noopener" target="_blank">
                {{site.contact.addressEn}}<br/>
                {{site.contact.addressZh}}
              </a>
</address>
</div>
<div class="contact-item">
<strong>體驗中心</strong>
<div>
              {{site.contact.experienceCentre}}
              <span class="visit-chip">預約參觀</span>
</div>
</div>
</div>
</div>
</section>
