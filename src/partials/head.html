<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{{page.title|e}}</title>
<meta name="description" content="{{page.description|e}}"/>
<meta name="keywords" content="{{page.keywords|e}}"/>
<meta name="robots" content="index,follow"/>
<link rel="canonical" href="{{page.canonical|e}}"/>
<link rel="icon" type="image/png" href="{{site.logo.mark}}"/>
<link rel="apple-touch-icon" href="{{site.logo.mark}}"/>
<meta property="og:type" content="{{page.ogType}}"/>
<meta property="og:locale" content="{{site.locale}}"/>
<meta property="og:site_name" content="{{site.name}}"/>
<meta property="og:title" content="{{page.ogTitle|e}}"/>
<meta property="og:description" content="{{page.ogDescription|e}}"/>
<meta property="og:url" content="{{page.canonical|e}}"/>
<meta property="og:image" content="{{page.ogImage|e}}"/>
<meta property="og:image:width" content="{{site.ogImageSize.width}}"/>
<meta property="og:image:height" content="{{site.ogImageSize.height}}"/>
<meta property="og:image:alt" content="{{page.ogImageAlt|e}}"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="{{page.ogTitle|e}}"/>
<meta name="twitter:description" content="{{page.ogDescription|e}}"/>
<meta name="twitter:image" content="{{page.ogImage|e}}"/>
<script type="application/ld+json">
{{page.orgLd}}
</script>
{{#if page.faqLd}}<script type="application/ld+json">
{{page.faqLd}}
</script>
{{/if}}<link rel="stylesheet" href="assets/site.css"/>
{{#if site.analytics.enabled}}<script async src="https://www.googletagmanager.com/gtag/js?id={{site.analytics.measurementId|e}}"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','{{site.analytics.measurementId|e}}');</script>
{{/if}}<script src="assets/js/track.js" defer></script>
<script src="assets/js/i18n.js" defer></script>
<script src="assets/js/site.js" defer></script>
<script src="assets/js/form.js" defer></script>
{{#each page.scripts}}<script src="assets/js/{{this}}.js" defer></script>
{{/each}}
